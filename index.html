<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BizName AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 800px;
            text-align: center;
            padding: 30px 0;
        }

        .badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 10px 18px;
            border-radius: 30px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        h1 {
            font-size: 52px;
            line-height: 1.1;
            margin: 10px 0;
        }

        h1 span {
            color: #a78bfa;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            margin: 20px auto 35px;
            max-width: 600px;
        }

        .box {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input,
        select {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
        }

        input {
            flex: 1;
        }

        select {
            width: 150px;
            cursor: pointer;
        }

        button {
            padding: 16px 22px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .generate-btn {
            width: 100%;
            font-weight: bold;
            font-size: 17px;
        }

        #result {
            margin-top: 25px;
        }

        #result h3 {
            margin-bottom: 15px;
        }

        .name-card {
            background: #334155;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            text-align: left;
            transition: 0.2s;
        }

        .name-card:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .name-text {
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .copy-btn {
            padding: 9px 14px;
            font-size: 13px;
            margin: 0;
            flex-shrink: 0;
        }

        .loading {
            color: #c4b5fd;
            padding: 15px;
        }

        .error {
            color: #fca5a5;
            padding: 10px;
        }

        @media (max-width: 650px) {

            h1 {
                font-size: 38px;
            }

            .input-row {
                flex-direction: column;
            }

            select {
                width: 100%;
            }

            .name-card {
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">✨ AI Powered</div>

        <h1>
            Find Your <span>Perfect</span><br>
            Business Name
        </h1>

        <p class="subtitle">
            Enter your business type and get creative name ideas instantly.
        </p>

        <div class="box">

            <div class="input-row">

                <input
                    type="text"
                    id="businessInput"
                    placeholder="Example: Clothing Store"
                >

                <select id="styleInput">
                    <option value="modern">Modern</option>
                    <option value="premium">Premium</option>
                    <option value="fun">Fun</option>
                    <option value="minimal">Minimal</option>
                </select>

            </div>

            <button
                class="generate-btn"
                onclick="generateNames()"
            >
                ✨ Generate Names
            </button>

            <div id="result"></div>

        </div>

    </div>


    <script>

        async function generateNames() {

            const business =
                document.getElementById("businessInput").value.trim();

            const style =
                document.getElementById("styleInput").value;

            const result =
                document.getElementById("result");


            if (business === "") {

                result.innerHTML =
                    '<p class="error">Please enter a business type.</p>';

                return;
            }


            result.innerHTML =
                '<div class="loading">✨ AI is generating creative names...</div>';


            try {

                const response = await fetch(
                    "https://bizname-ai.onrender.com",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            business: business,
                            style: style
                        })
                    }
                );


                const data = await response.json();


                if (data.error) {

                    result.innerHTML =
                        '<p class="error">Something went wrong.</p>';

                    return;
                }


                const names =
                    data.names
                        .split("\n")
                        .map(name => name.trim())
                        .filter(name => name !== "");


                result.innerHTML =
                    "<h3>✨ AI Name Ideas</h3>";


                names.forEach(function(name) {

                    const cleanName =
                        name.replace(/^\d+[\.\)\-\s]+/, "");


                    result.innerHTML += `

                        <div class="name-card">

                            <div class="name-text">
                                ${cleanName}
                            </div>

                            <button
                                class="copy-btn"
                                onclick="copyName('${cleanName.replace(/'/g, "\\'")}')"
                            >
                                📋 Copy
                            </button>

                        </div>

                    `;

                });

            }

            catch (error) {

                result.innerHTML =
                    '<p class="error">Could not connect to AI server.</p>';

                console.error(error);
            }

        }


        function copyName(name) {

            navigator.clipboard.writeText(name);

            alert("✅ Name copied!");

        }

    </script>

</body>

</html>
