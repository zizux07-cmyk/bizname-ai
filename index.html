<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BizName AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 800px;
            text-align: center;
            padding: 30px 0;
        }

        .badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.4);
            padding: 10px 18px;
            border-radius: 30px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        h1 {
            font-size: 52px;
            line-height: 1.1;
            margin: 10px 0;
        }

        h1 span {
            color: #a78bfa;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 18px;
            margin: 20px auto 35px;
            max-width: 600px;
        }

        .box {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input,
        select {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
        }

        input {
            flex: 1;
        }

        select {
            width: 150px;
            cursor: pointer;
        }

        button {
            padding: 16px 22px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .generate-btn {
            width: 100%;
            font-weight: bold;
            font-size: 17px;
        }

        #result {
            margin-top: 25px;
        }

        #result h3 {
            margin-bottom: 15px;
        }

        .name-card {
            background: #334155;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            text-align: left;
            transition: 0.2s;
        }

        .name-card:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .name-text {
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .copy-btn {
            padding: 9px 14px;
            font-size: 13px;
            margin: 0;
            flex-shrink: 0;
        }

        .loading {
            color: #c4b5fd;
            padding: 15px;
        }

        .error {
            color: #fca5a5;
            padding: 10px;
        }

        @media (max-width: 650px) {

            h1 {
                font-size: 38px;
            }

            .input-row {
                flex-direction: column;
            }

            select {
                width: 100%;
            }

            .name-card {
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">✨ AI Powered</div>

        <h1>
            Find Your <span>Perfect</span><br>
            Business Name
        </h1>

        <p class="subtitle">
            Enter your business type and get creative name ideas instantly.
        </p>

        <div class="box">

            <div class="input-row">

                <input
                    type="text"
                    id="businessInput"
                    placeholder="Example: Clothing Store"
                >

                <select id="styleInput">
                    <option value="modern">Modern</option>
                    <option value="premium">Premium</option>
                    <option value="fun">Fun</option>
                    <option value="minimal">Minimal</option>
                </select>

            </div>

            <button
                class="generate-btn"
                onclick="generateNames()"
            >
                ✨ Generate Names
            </button>

            <div id="result"></div>

        </div>

    </div>


<script>
async function generateNames() {
    const business = document.getElementById("businessInput").value.trim();
    const style = document.getElementById("styleInput").value;
    const result = document.getElementById("result");

    if (!business) {
        result.textContent = "Please enter a business type.";
        result.className = "error";
        return;
    }

    result.className = "";
    result.textContent = "✨ AI is generating names, meanings and taglines...";

    try {
        const response = await fetch(
            "https://bizname-ai.onrender.com/generate",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ business, style })
            }
        );

        const data = await response.json();

        if (!response.ok || data.error) {
            throw new Error(data.error || "AI request failed.");
        }

        const ideas = Array.isArray(data.ideas)
            ? data.ideas
            : (data.names || "")
                .split("\n")
                .filter(Boolean)
                .map(name => ({
                    name: name.replace(/^\d+[\.\)\-\s]+/, ""),
                    meaning: "",
                    tagline: "",
                    vibe: ""
                }));

        if (!ideas.length) {
            throw new Error("No names were returned. Please try again.");
        }

        result.replaceChildren();

        const heading = document.createElement("h3");
        heading.textContent = "✨ Your AI Brand Ideas";
        result.appendChild(heading);

        ideas.forEach(idea => {
            const card = document.createElement("div");
            card.className = "name-card";
            card.style.flexDirection = "column";
            card.style.alignItems = "stretch";

            const name = document.createElement("div");
            name.className = "name-text";
            name.textContent = idea.name;
            card.appendChild(name);

            if (idea.meaning) {
                const meaning = document.createElement("p");
                meaning.textContent = "💡 " + idea.meaning;
                card.appendChild(meaning);
            }

            if (idea.tagline) {
                const tagline = document.createElement("p");
                tagline.textContent = "✨ " + idea.tagline;
                tagline.style.fontStyle = "italic";
                card.appendChild(tagline);
            }

            if (idea.vibe) {
                const vibe = document.createElement("p");
                vibe.textContent = "🎨 Brand vibe: " + idea.vibe;
                card.appendChild(vibe);
            }

            const copyButton = document.createElement("button");
            copyButton.className = "copy-btn";
            copyButton.textContent = "📋 Copy Name";
            copyButton.addEventListener("click", () => copyName(idea.name));
            card.appendChild(copyButton);

            result.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        result.replaceChildren();

        const message = document.createElement("p");
        message.className = "error";
        message.textContent = error.message ||
            "Could not connect to AI server. Please try again.";
        result.appendChild(message);
    }
}

async function copyName(name) {
    try {
        await navigator.clipboard.writeText(name);
        alert("✅ Name copied!");
    } catch (error) {
        alert("Copy didn't work. Please select and copy the name manually.");
    }
}


    </script>

</body>

</html>
